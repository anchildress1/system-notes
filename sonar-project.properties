sonar.projectKey=anchildress1_system-notes
sonar.organization=anchildress1

sonar.sources=src
sonar.tests=src
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  **/coverage/**,\
  **/*.png,\
  **/*.woff2
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test files — Sonar treats these as test sources, not production code
sonar.test.inclusions=\
  src/**/*.test.ts,\
  src/**/*.test.tsx,\
  src/setupTests.ts,\
  src/test-utils/**

# Mirrors vitest coverage.exclude: page composition and SearchPage are covered by E2E.
sonar.coverage.exclusions=\
  src/app/**/page.tsx,\
  src/app/layout.tsx,\
  src/components/SearchPage/SearchPage.tsx
