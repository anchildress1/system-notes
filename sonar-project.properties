sonar.projectKey=anchildress1_system-notes
sonar.organization=anchildress1

sonar.sources=src
sonar.tests=tests
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  **/coverage/**,\
  **/*.png,\
  **/*.woff2
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test files — Sonar treats these as test sources, not production code
sonar.test.inclusions=\
  tests/**/*

# Mirrors vitest coverage.exclude: page composition is covered by E2E.
sonar.coverage.exclusions=\
  src/app/**/page.tsx,\
  src/app/layout.tsx
