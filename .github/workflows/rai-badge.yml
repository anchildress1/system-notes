name: RAI Attribution Badge

# Rescores the git history and opens a pull request when the README badge drifts.
# Without this the number is a snapshot that quietly rots into a false claim.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  badge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          # The action scores author dates across the whole history, so a shallow
          # clone would report against whatever slice CI happened to fetch.
          fetch-depth: 0

      - name: Score RAI footers and refresh the badge
        uses: anchildress1/rai-commit-badge@4116096f0a33a6ac8bf3daafcd239fa548328e99 # v1.0.0
