name: Build and Test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Two Lighthouse profiles: 9 desktop runs plus 20 mobile. The pair takes
    # ~5.5 min on a dev machine and the job also builds twice, installs
    # browsers, and runs E2E.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Browsers and System Dependencies
        run: npm exec -- playwright install --with-deps chromium webkit

      - name: Check Formatting
        run: make format-check

      - name: Lint Code
        run: make lint

      - name: Check Types
        run: make typecheck

      - name: Audit Dependencies
        run: npm run audit

      - name: Run Unit Tests
        run: make test

      - name: Store Web Unit Tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: web-unit-tests
          path: coverage/
          retention-days: 30

      - name: Run E2E Tests
        run: make test-e2e

      - name: Run Performance Tests
        id: perf
        run: make test-perf

      - name: Scan Secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Store Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # lhci writes .lighthouseci/ itself, so the directory is missing only when
      # an earlier step failed and the perf step never ran. Uploading anyway
      # warns that it found no files, on a job that already failed for a
      # different reason.
      #
      # Both paths: `lhci collect` clears its output directory, so the mobile run
      # wipes the desktop results. test:perf copies them aside first, and the two
      # are uploaded together.
      - name: Store Lighthouse Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.perf.outcome != 'skipped'
        with:
          name: lighthouse-report
          path: |
            .lighthouseci/
            .lighthouseci-desktop/
          retention-days: 30
