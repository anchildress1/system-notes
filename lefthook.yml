# lefthook.yml
pre-commit:
  parallel: false
  commands:
    format:
      run: make format
      stage_fixed: true
    lint:
      run: make lint
      stage_fixed: true
    scan-secrets:
      run: make secret-scan

commit-msg:
  commands:
    commitlint:
      run: npm exec -- commitlint --edit

pre-push:
  parallel: false
  commands:
    unit-tests:
      run: make test
    security-scan:
      run: make secret-scan
    # Performance is 98 desktop / 92 mobile; accessibility, best-practices, and SEO are 100.
    performance:
      run: make test-perf
